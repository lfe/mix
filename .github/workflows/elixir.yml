name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Elixir 1.19
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.19'
            otp: '27'
          - elixir: '1.19'
            otp: '26'

          # Elixir 1.18
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.18'
            otp: '26'
          - elixir: '1.18'
            otp: '25'

          # Elixir 1.17
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.17'
            otp: '26'
          - elixir: '1.17'
            otp: '25'

          # Elixir 1.16
          - elixir: '1.16'
            otp: '26'
          - elixir: '1.16'
            otp: '25'
          - elixir: '1.16'
            otp: '24'

          # Elixir 1.15
          - elixir: '1.15'
            otp: '26'
          - elixir: '1.15'
            otp: '25'
          - elixir: '1.15'
            otp: '24'

          # Elixir 1.14
          - elixir: '1.14'
            otp: '25'
          - elixir: '1.14'
            otp: '24'

    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Set up Elixir and Erlang
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }}
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
